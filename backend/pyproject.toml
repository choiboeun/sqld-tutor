[project]
name = "sqld-tutor-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-anthropic>=0.3.0",
    "langsmith>=0.1.0",
    "chromadb>=0.5.0",
    "supabase>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "httpx>=0.27.0",
    "sentry-sdk[fastapi]>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
