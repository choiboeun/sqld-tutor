<svg xmlns="http://www.w3.org/2000/svg" width="520" height="260" viewBox="0 0 520 260" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">

  <text x="260" y="20" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">SAL 컬럼 인덱스 (B-Tree) 구조</text>

  <!-- B-Tree 구조 (왼쪽 절반) -->
  <!-- Root -->
  <rect x="195" y="38" width="90" height="26" fill="white" stroke="#222" stroke-width="1.5"/>
  <text x="240" y="56" text-anchor="middle" font-size="12" fill="#222">50</text>
  <text x="240" y="34" text-anchor="middle" font-size="9" fill="#555">루트 노드</text>

  <!-- Level 2 -->
  <rect x="80" y="88" width="90" height="26" fill="white" stroke="#222" stroke-width="1.5"/>
  <text x="125" y="106" text-anchor="middle" font-size="12" fill="#222">20 | 35</text>
  <rect x="310" y="88" width="90" height="26" fill="white" stroke="#222" stroke-width="1.5"/>
  <text x="355" y="106" text-anchor="middle" font-size="12" fill="#222">60 | 80</text>
  <text x="125" y="84" text-anchor="middle" font-size="9" fill="#555">브랜치 노드</text>
  <text x="355" y="84" text-anchor="middle" font-size="9" fill="#555">브랜치 노드</text>

  <!-- 연결선 -->
  <line x1="225" y1="64" x2="140" y2="88" stroke="#333" stroke-width="1.2"/>
  <line x1="255" y1="64" x2="340" y2="88" stroke="#333" stroke-width="1.2"/>

  <!-- 리프 노드 -->
  <text x="240" y="144" text-anchor="middle" font-size="9" fill="#555">리프 노드</text>
  <rect x="30" y="150" width="55" height="26" fill="white" stroke="#333" stroke-width="1"/>
  <text x="57" y="168" text-anchor="middle" font-size="11" fill="#333">20</text>

  <rect x="100" y="150" width="55" height="26" fill="white" stroke="#333" stroke-width="1"/>
  <text x="127" y="168" text-anchor="middle" font-size="11" fill="#333">35</text>

  <rect x="195" y="150" width="55" height="26" fill="white" stroke="#333" stroke-width="1"/>
  <text x="222" y="168" text-anchor="middle" font-size="11" fill="#333">50</text>

  <rect x="290" y="150" width="55" height="26" fill="white" stroke="#333" stroke-width="1"/>
  <text x="317" y="168" text-anchor="middle" font-size="11" fill="#333">60</text>

  <rect x="385" y="150" width="55" height="26" fill="white" stroke="#333" stroke-width="1"/>
  <text x="412" y="168" text-anchor="middle" font-size="11" fill="#333">80</text>

  <!-- 리프 연결선 -->
  <line x1="105" y1="114" x2="57" y2="150" stroke="#555" stroke-width="1"/>
  <line x1="125" y1="114" x2="127" y2="150" stroke="#555" stroke-width="1"/>
  <line x1="240" y1="64" x2="222" y2="150" stroke="#555" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="335" y1="114" x2="317" y2="150" stroke="#555" stroke-width="1"/>
  <line x1="365" y1="114" x2="412" y2="150" stroke="#555" stroke-width="1"/>

  <!-- 리프 노드 연결 (순서 보장) -->
  <line x1="85" y1="163" x2="100" y2="163" stroke="#333" stroke-width="1"/>
  <line x1="155" y1="163" x2="195" y2="163" stroke="#333" stroke-width="1"/>
  <line x1="250" y1="163" x2="290" y2="163" stroke="#333" stroke-width="1"/>
  <line x1="345" y1="163" x2="385" y2="163" stroke="#333" stroke-width="1"/>

  <!-- 구분선 -->
  <line x1="10" y1="200" x2="510" y2="200" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- 인덱스 활용 여부 비교 -->
  <text x="130" y="218" text-anchor="middle" font-size="10" fill="#333">WHERE SAL = 50</text>
  <text x="130" y="232" text-anchor="middle" font-size="10" fill="#333">→ 루트 탐색 후 리프 직접 접근</text>
  <text x="130" y="246" text-anchor="middle" font-size="10" fill="#333">✔ 인덱스 사용</text>

  <text x="385" y="218" text-anchor="middle" font-size="10" fill="#333">WHERE SAL * 1.1 = 55</text>
  <text x="385" y="232" text-anchor="middle" font-size="10" fill="#333">→ 컬럼 변형 시 인덱스 무효</text>
  <text x="385" y="246" text-anchor="middle" font-size="10" fill="#333">✘ Full Scan 발생</text>
</svg>
