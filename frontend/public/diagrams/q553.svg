  <rect x="10" y="63" width="230" height="26" fill="white" stroke="#222" stroke-width="1"/>
  <text x="45" y="80" text-anchor="middle" font-size="10" fill="#222">O-001</text>
  <text x="120" y="80" text-anchor="middle" font-size="10" fill="#222">김철수</text>
  <text x="195" y="74" text-anchor="middle" font-size="10" fill="#111" font-weight="bold">사과, 배, 포도</text>

