  <text x="457" y="54" text-anchor="middle" font-size="10" font-weight="bold" fill="#111">상품명</text>

  <rect x="275" y="63" width="235" height="26" fill="white" stroke="#222" stroke-width="1"/>
  <text x="310" y="80" text-anchor="middle" font-size="10" fill="#222">O-001</text>
  <text x="385" y="80" text-anchor="middle" font-size="10" fill="#222">김철수</text>
  <text x="457" y="80" text-anchor="middle" font-size="10" fill="#222">사과</text>

  <rect x="275" y="89" width="235" height="26" fill="white" stroke="#222" stroke-width="1"/>
  <text x="310" y="106" text-anchor="middle" font-size="10" fill="#222">O-001</text>
  <text x="385" y="106" text-anchor="middle" font-size="10" fill="#222">김철수</text>
  <text x="457" y="106" text-anchor="middle" font-size="10" fill="#222">배</text>

  <rect x="275" y="115" width="235" height="26" fill="white" stroke="#222" stroke-width="1"/>
  <text x="310" y="132" text-anchor="middle" font-size="10" fill="#222">O-001</text>
  <text x="385" y="132" text-anchor="middle" font-size="10" fill="#222">김철수</text>
  <text x="457" y="132" text-anchor="middle" font-size="10" fill="#222">포도</text>

  <rect x="275" y="141" width="235" height="26" fill="white" stroke="#222" stroke-width="1"/>
  <text x="310" y="158" text-anchor="middle" font-size="10" fill="#222">O-002</text>
  <text x="385" y="158" text-anchor="middle" font-size="10" fill="#222">이영희</text>
  <text x="457" y="158" text-anchor="middle" font-size="10" fill="#222">딸기</text>

  <rect x="275" y="167" width="235" height="26" fill="white" stroke="#222" stroke-width="1"/>
  <text x="310" y="184" text-anchor="middle" font-size="10" fill="#222">O-002</text>
  <text x="385" y="184" text-anchor="middle" font-size="10" fill="#222">이영희</text>
  <text x="457" y="184" text-anchor="middle" font-size="10" fill="#222">수박</text>

  <text x="260" y="230" text-anchor="middle" font-size="10" fill="#555">각 행은 하나의 원자값만 가져야 한다 (1NF)</text>
