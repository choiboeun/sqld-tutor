  <text x="195" y="100" text-anchor="middle" font-size="10" fill="#111" font-weight="bold">딸기, 수박</text>

  <rect x="10" y="115" width="230" height="20" fill="white" stroke="#222" stroke-width="1"/>
  <text x="125" y="129" text-anchor="middle" font-size="9" fill="#555">...</text>

  <rect x="30" y="144" width="190" height="30" fill="none" stroke="#555" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="125" y="158" text-anchor="middle" font-size="10" fill="#333">⚠ 상품목록에 여러 값 → 원자성 위반</text>
  <text x="125" y="170" text-anchor="middle" font-size="10" fill="#333">(1NF 위반)</text>

  <!-- 화살표 -->
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto">
