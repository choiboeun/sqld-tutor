<text x='10' y='195' font-size='10' fill='#333' font-weight='bold'>CREATE VIEW 개발팀_고급 AS</text>
<text x='10' y='212' font-size='10' fill='#333'>  SELECT 사원ID, 이름, 급여 FROM 사원 WHERE 부서 = '개발' AND 급여 >= 4000;</text>
<text x='10' y='229' font-size='10' fill='#555'>SELECT COUNT(*) FROM 개발팀_고급;</text>

