<svg xmlns='http://www.w3.org/2000/svg' width='520' height='215' viewBox='0 0 520 215' font-family='Malgun Gothic, Apple SD Gothic Neo, sans-serif'>
<text x='260' y='22' text-anchor='middle' font-size='13' font-weight='bold' fill='#111'>함수 종속 관계 분석</text>
<text x='260' y='45' text-anchor='middle' font-size='11' fill='#333'>테이블: 주문(주문ID, 고객ID, 고객명, 상품ID, 상품명, 수량)</text>
<text x='260' y='63' text-anchor='middle' font-size='11' fill='#555'>PK = {주문ID, 상품ID}</text>

<rect x='10' y='80' width='500' height='120' fill='white' stroke='#ccc' stroke-width='1' rx='4'/>
<text x='20' y='100' font-size='10' fill='#333' font-weight='bold'>함수 종속 관계:</text>
<text x='20' y='118' font-size='10' fill='#222'>{주문ID, 상품ID} → 수량  (전체 키에 종속 ✔)</text>
<text x='20' y='136' font-size='10' fill='#dc2626'>주문ID → 고객ID, 고객명  (부분 함수 종속 ✘)</text>
<text x='20' y='154' font-size='10' fill='#dc2626'>상품ID → 상품명  (부분 함수 종속 ✘)</text>
<text x='20' y='172' font-size='10' fill='#dc2626'>고객ID → 고객명  (이행 함수 종속 ✘)</text>

</svg>