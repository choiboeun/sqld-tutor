<svg xmlns="http://www.w3.org/2000/svg" width="520" height="260" viewBox="0 0 520 260" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">

  <text x="260" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">도서관 ERD — 관계 분석</text>

  <!-- 회원 -->
  <rect x="20" y="70" width="120" height="95" fill="white" stroke="#222" stroke-width="1.5"/>
  <rect x="20" y="70" width="120" height="26" fill="#e8e8e8" stroke="#222" stroke-width="1.5"/>
  <text x="80" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">회원</text>
  <text x="80" y="113" text-anchor="middle" font-size="11" fill="#222">회원ID (PK)</text>
  <text x="80" y="130" text-anchor="middle" font-size="11" fill="#222">이름</text>
  <text x="80" y="147" text-anchor="middle" font-size="11" fill="#222">연락처</text>

  <!-- 대출 -->
  <rect x="200" y="45" width="120" height="128" fill="white" stroke="#222" stroke-width="2"/>
  <rect x="200" y="45" width="120" height="26" fill="#e8e8e8" stroke="#222" stroke-width="2"/>
  <text x="260" y="63" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">대출</text>
  <text x="260" y="88" text-anchor="middle" font-size="11" fill="#222">대출ID (PK)</text>
  <text x="260" y="105" text-anchor="middle" font-size="11" fill="#222">회원ID (PK, FK)</text>
  <text x="260" y="122" text-anchor="middle" font-size="11" fill="#222">도서ID (FK)</text>
  <text x="260" y="139" text-anchor="middle" font-size="11" fill="#222">대출일</text>
  <text x="260" y="156" text-anchor="middle" font-size="11" fill="#222">반납예정일</text>

  <!-- 도서 -->
  <rect x="380" y="70" width="120" height="95" fill="white" stroke="#222" stroke-width="1.5"/>
  <rect x="380" y="70" width="120" height="26" fill="#e8e8e8" stroke="#222" stroke-width="1.5"/>
  <text x="440" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">도서</text>
  <text x="440" y="113" text-anchor="middle" font-size="11" fill="#222">도서ID (PK)</text>
  <text x="440" y="130" text-anchor="middle" font-size="11" fill="#222">제목</text>
  <text x="440" y="147" text-anchor="middle" font-size="11" fill="#222">저자</text>

  <!-- 회원 - 대출: 식별관계(실선) -->
  <line x1="140" y1="110" x2="200" y2="100" stroke="#222" stroke-width="2"/>
  <text x="150" y="104" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="188" y="99" font-size="11" fill="#333" font-weight="bold">N</text>
  <text x="148" y="122" font-size="9" fill="#555">식별(실선)</text>

  <!-- 도서 - 대출: 비식별관계(점선) -->
  <line x1="320" y1="100" x2="380" y2="110" stroke="#333" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="326" y="96" font-size="11" fill="#333" font-weight="bold">N</text>
  <text x="368" y="106" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="332" y="122" font-size="9" fill="#555">비식별(점선)</text>

  <!-- 범례 -->
  <line x1="20" y1="230" x2="60" y2="230" stroke="#222" stroke-width="2"/>
  <text x="68" y="234" font-size="10" fill="#333">식별 관계 (실선) — 부모 PK가 자식 PK에 포함</text>
  <line x1="20" y1="248" x2="60" y2="248" stroke="#333" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="68" y="252" font-size="10" fill="#333">비식별 관계 (점선) — 부모 PK가 자식 FK에만 포함</text>
</svg>
