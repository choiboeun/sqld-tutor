<svg xmlns='http://www.w3.org/2000/svg' width='520' height='210' viewBox='0 0 520 210' font-family='Malgun Gothic, Apple SD Gothic Neo, sans-serif'>
<text x='260' y='22' text-anchor='middle' font-size='13' font-weight='bold' fill='#111'>BCNF 위반 분석</text>
<text x='260' y='42' text-anchor='middle' font-size='11' fill='#333'>테이블: 수강지도(학생ID, 과목명, 지도교수)</text>
<text x='260' y='58' text-anchor='middle' font-size='11' fill='#555'>후보키: {학생ID, 과목명} 또는 {학생ID, 지도교수}</text>

<rect x='10' y='72' width='500' height='100' fill='white' stroke='#ccc' stroke-width='1' rx='4'/>
<text x='20' y='92' font-size='10' fill='#222' font-weight='bold'>함수 종속 관계:</text>
<text x='20' y='110' font-size='10' fill='#222'>{학생ID, 과목명} → 지도교수  (후보키 → 일반 속성 ✔)</text>
<text x='20' y='128' font-size='10' fill='#222'>{학생ID, 지도교수} → 과목명  (후보키 → 일반 속성 ✔)</text>
<text x='20' y='146' font-size='10' fill='#dc2626'>지도교수 → 과목명  (비후보키가 결정자 → BCNF 위반 ✘)</text>

<text x='260' y='192' text-anchor='middle' font-size='10' fill='#555'>BCNF: 모든 결정자가 후보키이어야 한다</text>
</svg>