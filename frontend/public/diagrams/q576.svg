<svg xmlns='http://www.w3.org/2000/svg' width='520' height='205' viewBox='0 0 520 205' font-family='Malgun Gothic, Apple SD Gothic Neo, sans-serif'>
<text x='260' y='22' text-anchor='middle' font-size='13' font-weight='bold' fill='#111'>컬럼별 카디널리티 비교 (전체 행: 100만)</text>

<rect x='10' y='38' width='500' height='26' fill='#e8e8e8' stroke='#222' stroke-width='1.5'/>
<text x='20' y='56' font-size='10' font-weight='bold' fill='#111'>컬럼명</text>
<text x='160' y='56' font-size='10' font-weight='bold' fill='#111'>고유값 수</text>
<text x='280' y='56' font-size='10' font-weight='bold' fill='#111'>예시 값</text>
<text x='420' y='56' font-size='10' font-weight='bold' fill='#111'>선택도</text>
<line x1='10' y1='64' x2='510' y2='64' stroke='#ccc' stroke-width='1'/>

<rect x='10' y='64' width='500' height='26' fill='white' stroke='#ccc' stroke-width='1'/>
<text x='20' y='82' font-size='10' fill='#222'>주민번호</text><text x='160' y='82' font-size='10' fill='#222'>1,000,000</text><text x='280' y='82' font-size='10' fill='#222'>고유 식별자</text><text x='420' y='82' font-size='10' fill='#16a34a' font-weight='bold'>매우 높음</text>

<rect x='10' y='90' width='500' height='26' fill='#f5f5f5' stroke='#ccc' stroke-width='1'/>
<text x='20' y='108' font-size='10' fill='#222'>이름</text><text x='160' y='108' font-size='10' fill='#222'>50,000</text><text x='280' y='108' font-size='10' fill='#222'>홍길동 등</text><text x='420' y='108' font-size='10' fill='#16a34a'>높음</text>

<rect x='10' y='116' width='500' height='26' fill='white' stroke='#ccc' stroke-width='1'/>
<text x='20' y='134' font-size='10' fill='#222'>지역</text><text x='160' y='134' font-size='10' fill='#222'>17</text><text x='280' y='134' font-size='10' fill='#222'>서울, 부산 등</text><text x='420' y='134' font-size='10' fill='#dc2626'>낮음</text>

<rect x='10' y='142' width='500' height='26' fill='#f5f5f5' stroke='#ccc' stroke-width='1'/>
<text x='20' y='160' font-size='10' fill='#222'>성별</text><text x='160' y='160' font-size='10' fill='#222'>2</text><text x='280' y='160' font-size='10' fill='#222'>M, F</text><text x='420' y='160' font-size='10' fill='#dc2626' font-weight='bold'>매우 낮음</text>

<text x='260' y='190' text-anchor='middle' font-size='10' fill='#555'>선택도(Selectivity) = 고유값 수 / 전체 행 수</text>
</svg>