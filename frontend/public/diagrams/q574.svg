<svg xmlns='http://www.w3.org/2000/svg' width='520' height='215' viewBox='0 0 520 215' font-family='Malgun Gothic, Apple SD Gothic Neo, sans-serif'>
<text x='260' y='22' text-anchor='middle' font-size='13' font-weight='bold' fill='#111'>복합 인덱스 구조</text>

<rect x='80' y='40' width='360' height='40' fill='#e8e8e8' stroke='#222' stroke-width='1.5' rx='4'/>
<text x='260' y='55' text-anchor='middle' font-size='11' font-weight='bold' fill='#111'>IDX_EMP (DEPT_ID, JOB, SAL)</text>
<text x='260' y='72' text-anchor='middle' font-size='10' fill='#555'>인덱스 컬럼 순서: 1번째=DEPT_ID, 2번째=JOB, 3번째=SAL</text>

<rect x='10' y='100' width='500' height='100' fill='white' stroke='#ccc' stroke-width='1' rx='4'/>
<text x='20' y='120' font-size='10' fill='#222' font-weight='bold'>인덱스 사용 여부:</text>
<text x='20' y='138' font-size='10' fill='#16a34a'>WHERE DEPT_ID = 10                       → 인덱스 사용 ✔  (선두 컬럼)</text>
<text x='20' y='155' font-size='10' fill='#16a34a'>WHERE DEPT_ID = 10 AND JOB = 'CLERK'    → 인덱스 사용 ✔  (선두 순서)</text>
<text x='20' y='172' font-size='10' fill='#dc2626'>WHERE JOB = 'CLERK'                      → 인덱스 미사용 ✘  (선두 누락)</text>
<text x='20' y='189' font-size='10' fill='#dc2626'>WHERE DEPT_ID = 10 AND SAL > 2000       → SAL 인덱스 부분 사용</text>
</svg>